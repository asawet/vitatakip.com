# Supabase ücretsiz planı 7 gün etkinlik görmeyen projeyi duraklatır (sunumda tüm bulut istekleri başarısız olur).
# Bu iş günde bir kez public.keepalive() fonksiyonunu çağırır (supabase/migrations/20261127182000_keepalive.sql).
# Gerekli depo sırları (Settings > Secrets and variables > Actions):
#   SUPABASE_URL              https://<proje>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  sb_publishable_... (herkese açık anahtar; RLS korur)
# Not: GitHub, 60 gün commit görmeyen depolarda zamanlanmış işleri kapatır; Actions sekmesinden yeniden açılabilir.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 6 * * *"   # her gün 06:17 UTC (09:17 TSİ)
  workflow_dispatch: {}      # Actions sekmesinden elle çalıştırma

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: public.keepalive() çağır
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY sırları tanımlı değil"; exit 1
          fi
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}')
            echo "Deneme $i: HTTP $code, yanıt: $(cat /tmp/out)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Supabase yanıt vermedi; proje duraklatılmış olabilir (Dashboard > Resume project)"
          exit 1
